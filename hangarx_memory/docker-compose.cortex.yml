# All-in-one local Cortex stack for the hangarx-memory Hermes plugin.
#
# Start with: docker compose -f docker-compose.cortex.yml up -d
# Or from inside Hermes: hermes hangarx-memory docker up
#
# This is a self-contained, single-node Cortex deployment optimized for
# local development. No external Postgres or ClickHouse required —
# storage runs in-memory inside the Cortex API container, and FalkorDB
# (a Redis-compatible graph + vector store) is the only backing service.
#
# Resource defaults are tuned for a developer laptop. Override via
# environment variables on the host:
#
#   LLM_PROVIDER=ollama|openai|gemini   (default: ollama)
#   LLM_MODEL=<name>                    (default: llama3)
#   OLLAMA_BASE_URL=http://...:11434    (default: host.docker.internal)
#   EMBEDDING_PROVIDER=ollama|openai    (default: ollama)
#   EMBEDDING_MODEL=<name>              (default: nomic-embed-text)
#   GEMINI_API_KEY=<key>                (optional)
#   OPENAI_API_KEY=<key>                (optional)
#
# After `up`, the hangarx-memory plugin auto-detects this stack at
# http://localhost:3400 and runs in keyless local mode — no
# CORTEX_API_KEY required for the local-dev path.

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: hangarx-cortex-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cortex-api:
    image: ghcr.io/3-elements-design/cortex-api:latest
    container_name: hangarx-cortex-api
    restart: unless-stopped
    ports:
      - "3400:3400"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"
        reservations:
          memory: 512m
          cpus: "0.5"
    environment:
      PORT: 3400
      # Graph + vector: FalkorDB (Redis-compatible)
      GRAPH_STORE_TYPE: falkordb
      VECTOR_STORE_TYPE: falkordb
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      # Storage: in-memory — no Postgres needed for local dev
      STORAGE_TYPE: memory
      # Analytics: in-memory — no ClickHouse needed for local dev
      ANALYTICS_STORE_TYPE: memory
      # LLM defaults to Ollama (no API key). Override LLM_PROVIDER for
      # OpenAI / Gemini and provide the matching key below.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Embeddings — same provider story.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      # Optional API keys — passed through if set on the host.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # AUTH_OPTIONAL_FOR_LOCAL: when running on localhost without a
      # CORTEX_API_KEY, Cortex accepts unauthenticated requests. This
      # is what enables the hangarx-memory plugin's keyless local
      # mode. Disable by setting AUTH_REQUIRED=true if you want the
      # local stack to require keys too.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:3400/health
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  falkordb_data:
    name: hangarx-cortex-falkordb-data
