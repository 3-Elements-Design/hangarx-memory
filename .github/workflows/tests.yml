name: tests

on:
  push:
    paths:
      - "packages/hangarx-memory/**"
      - ".github/workflows/hangarx-memory-tests.yml"
  pull_request:
    paths:
      - "packages/hangarx-memory/**"

defaults:
  run:
    working-directory: packages/hangarx-memory

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check hangarx_memory tests
      - name: Test
        run: pytest -ra
